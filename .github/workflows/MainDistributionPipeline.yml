#
# VestBrain lockstep candidate v2: fts against core fc4002c6 (cyanoptera-era, vss@main pin 2026-09-18) (the SHA
# upstream duckdb-vss declares — the vector extension is the interface-
# coupled one, so its pin LEADS; core 8806a9f proved unbuildable for any
# vss commit: QualifiedName rename lands before it, index-interface rework
# after). Build-only, linux_amd64 only.
#
name: Main Extension Distribution Pipeline
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-candidate-build:
    name: Build fts against core fc4002c6 (cyanoptera-era, vss@main pin 2026-09-18)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      extension_name: fts
      duckdb_version: fc4002c6e36f1e2d17d7c5b1a604777d69238d2b
      ci_tools_version: main
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64;osx_amd64;osx_arm64;linux_arm64;linux_amd64_musl"
